name: Sync final 1.8.0 files

on:
  push:
    branches:
      - sync/1.8.0-settings

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract final tested files
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/final.part-* > /tmp/final.tar.gz.b64
          base64 -d /tmp/final.tar.gz.b64 > /tmp/final.tar.gz
          tar -xzf /tmp/final.tar.gz -C .
      - name: Verify exact final blobs
        shell: bash
        run: |
          set -euo pipefail
          check() { actual="$(git hash-object "$1")"; test "$actual" = "$2" || { echo "$1: $actual != $2"; exit 1; }; }
          check CHANGELOG.md 013a8dae84ac6f66ee644e71634bc6cad631ff52
          check assets/admin.css b6ae9b937f4ad931f6791de2e854eec62fc9cde5
          check formcourier-notifications-pro.php 3ca0dd72216f36d44a074d5da83a0067f3a3a41c
          check includes/core/class-formcourier-notifications-pro-log-cleanup.php 23c6837c225a4ad8a1035497b1a1c3433d865782
          check includes/core/class-formcourier-notifications-pro-log-details-ui.php 8ee505e72a8a2cdf0ca71836fd39340a0bd81c0e
          check includes/core/class-formcourier-notifications-pro-logger.php 17fb8cdb7a0d2c188426c9ac3599c4f993b13413
          check includes/core/class-formcourier-notifications-pro-plugin.php eb120dd8aee54a68b287c5ba8c8ae1212babe545
          check includes/core/class-formcourier-notifications-pro-settings.php dc14b989fb6721b7482cc1316ae5cfa4426540a2
          check readme.txt 8e9d3045cdb52844945a452136dce79237966b3c
          check uninstall.php 524b610e6593bb55842e514ac3d03cfb5401ee01
      - name: Commit final tested files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync
          rm -f .github/workflows/sync-final-1.8.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate final tested 1.8.0 tree"
          git push origin HEAD:sync/1.8.0-settings
