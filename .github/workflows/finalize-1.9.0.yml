name: Finalize 1.9.0 settings

on:
  push:
    branches:
      - release/1.9.0

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.9.0
      - name: Reconstruct tested settings file
        shell: bash
        run: |
          cat .sync/settings.part.00 .sync/settings.part.01 | base64 -d | gzip -d > includes/core/class-formcourier-notifications-pro-settings.php
          test "$(git hash-object includes/core/class-formcourier-notifications-pro-settings.php)" = "0da1b371353cee898a004408b7458234c7603b0a"
      - name: Commit final release source
        shell: bash
        run: |
          rm -rf .sync
          rm -f .github/workflows/finalize-1.9.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md assets/admin.css assets/admin.js formcourier-notifications-pro.php includes/core/class-formcourier-notifications-pro-routing-engine.php includes/core/class-formcourier-notifications-pro-settings.php readme.txt .github/workflows/finalize-1.9.0.yml .sync
          git commit -m "Release 1.9.0 advanced routing"
          git push origin HEAD:release/1.9.0
