name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, Bot Tokens, private Chat IDs, API keys, and personal data before submitting.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "1.6.0"
    validations:
      required: true
  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true
  - type: dropdown
    id: form-provider
    attributes:
      label: Form provider
      options:
        - Contact Form 7
        - WPForms
        - Fluent Forms
        - Forminator
        - Ninja Forms
        - Gravity Forms
        - Not form-provider specific
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
